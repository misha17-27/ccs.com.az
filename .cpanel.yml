---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ccscom/public_html/
    # Public site: router (index.php), styles/scripts/images, API endpoints (contact form, Instagram feed)
    - /bin/cp index.php robots.txt $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH
    # Admin panel and the PHP core with the site templates (app/.htaccess denies web access), plus the uploads folder rules.
    # Uploaded files and the database stay on the server: uploads/* is git-ignored, the DB lives in ~/ccs-private.
    - /bin/cp -R admin $DEPLOYPATH
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R uploads $DEPLOYPATH
    # Design prototypes and their version picker are gone; /v1/ and the like now redirect to the home page.
    - /bin/rm -rf ${DEPLOYPATH}v1 ${DEPLOYPATH}v2 ${DEPLOYPATH}v3 ${DEPLOYPATH}index.html
    # Rewrite rules for page addresses, merged into .htaccess without touching cPanel's own lines.
    - /bin/sh deploy/merge-htaccess.sh $DEPLOYPATH
