---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ccscom/public_html/
    - /bin/cp index.html $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R v1 $DEPLOYPATH
    - /bin/cp -R v2 $DEPLOYPATH
    - /bin/cp -R v3 $DEPLOYPATH
    - /bin/cp -R api $DEPLOYPATH
    # Cache busting: every deploy gets a fresh ?v= on CSS/JS links (Cloudflare caches them for hours)
    - /bin/sed -i "s/?v=dev/?v=$(/bin/date +%Y%m%d%H%M%S)/g" ${DEPLOYPATH}v1/index.html ${DEPLOYPATH}v2/index.html ${DEPLOYPATH}v3/index.html
