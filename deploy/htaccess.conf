# Public site: every address that is not a real file or folder goes to the router (index.php),
# e.g. /haqqimizda, /ru/xidmetler, /sitemap.xml. Folders such as /admin/ are served as they are.
<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteBase /
  RewriteRule ^$ index.php [L]
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ index.php [L]
</IfModule>
